---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@7fbf5075f8e0296624e56ec7c8ee7ce7ed1c790e # v0.83.2
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '7fbf5075f8e0296624e56ec7c8ee7ce7ed1c790e' # v0.83.2
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
