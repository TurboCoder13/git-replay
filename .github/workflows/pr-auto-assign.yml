---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@cade5e687630ce3208bf914d0b1590145f3d569e # v0.83.11
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'cade5e687630ce3208bf914d0b1590145f3d569e' # v0.83.11
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
