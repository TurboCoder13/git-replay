---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@63c46e9549168ad7fa660c0b0bc7009b501cadea # v0.83.0
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '63c46e9549168ad7fa660c0b0bc7009b501cadea' # v0.83.0
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
