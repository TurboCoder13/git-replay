---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@3aea2374000ace164c56ebbcb954cae004f98055 # v0.98.4
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '3aea2374000ace164c56ebbcb954cae004f98055' # v0.98.4
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
