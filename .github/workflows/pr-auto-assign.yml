---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@761e2f173be08f57f0be18d8332e2b063387d987 # v0.83.9
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '761e2f173be08f57f0be18d8332e2b063387d987' # v0.83.9
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
