---
name: PR - Title Validation

'on':
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: semantic-pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-semantic-pr-title.yml@761e2f173be08f57f0be18d8332e2b063387d987 # v0.83.9
    with:
      tooling-ref: '761e2f173be08f57f0be18d8332e2b063387d987' # v0.83.9
      # Org ruleset (checks-git-replay): semantic-title / 📝 Validate PR Title
      job-name: '📝 Validate PR Title'
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-minimal
    permissions:
      contents: read
      # write: post/clear marker-based failure comments (post-failure-comment default)
      pull-requests: write
