---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@e119ddbc8ba1fe611ed10163b2b2748d5148ab6a # v0.83.12
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'e119ddbc8ba1fe611ed10163b2b2748d5148ab6a' # v0.83.12
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
