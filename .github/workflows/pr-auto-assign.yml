---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@48f0219de2d87df9b9884bf8f6e4f439ab4bce1c # v0.83.4
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '48f0219de2d87df9b9884bf8f6e4f439ab4bce1c' # v0.83.4
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
