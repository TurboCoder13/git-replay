---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@cda8cb5ae9dc69b82f396ac468c7a091a65f8568 # v0.82.4
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'cda8cb5ae9dc69b82f396ac468c7a091a65f8568' # v0.82.4
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
