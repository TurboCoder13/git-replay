---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@63c46e9549168ad7fa660c0b0bc7009b501cadea # v0.83.0
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '63c46e9549168ad7fa660c0b0bc7009b501cadea' # v0.83.0
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
