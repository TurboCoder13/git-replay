---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@cade5e687630ce3208bf914d0b1590145f3d569e # v0.83.11
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'cade5e687630ce3208bf914d0b1590145f3d569e' # v0.83.11
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
