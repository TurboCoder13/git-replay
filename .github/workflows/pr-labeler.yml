---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@34264da09655a7763cd79548132bbd2548b14aac # v0.83.8
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '34264da09655a7763cd79548132bbd2548b14aac' # v0.83.8
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
