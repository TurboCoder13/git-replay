---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@07096402542cc6bd8da4a04aa969460207403346 # v0.83.5
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '07096402542cc6bd8da4a04aa969460207403346' # v0.83.5
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
