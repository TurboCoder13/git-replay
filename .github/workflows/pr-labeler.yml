---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@e10242e81ebb34ceb796efeff39ba9824178f46e # v0.75.2
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'e10242e81ebb34ceb796efeff39ba9824178f46e' # v0.75.2
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
