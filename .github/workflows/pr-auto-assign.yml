---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@3aea2374000ace164c56ebbcb954cae004f98055 # v0.98.4
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '3aea2374000ace164c56ebbcb954cae004f98055' # v0.98.4
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
